# 出题质量回归规则（前20条高频）
# 从 quality-feedback.md 296行提炼的核心规则，用于生成阶段自查

生成阶段规则:
  R001_事实闭环:
    规则: "题干、选项、答案、解析的对象、条件、方向、单位、时间口径必须逐项一致"
    必须打回: "题干描述长边解析按短边计算；题干按经过n天解析按第n天；代码补入题干没有的条件"

  R002_考点与已知信息分离:
    规则: "先分成题目提供的已知信息和考生必须推出的目标知识，目标知识不得重新送回题干"
    必须打回: "要考平闰年却直接写明平年；要考大小月却注明天数；要考逻辑翻译却给出箭头"

  R003_无歧义表达:
    规则: "关键名词、空间方向、范围、比较基准和计数边界必须只有一种合理解释"
    必须打回: "同一句话可形成两套不同模型或答案；沿长边中线等缺少明确几何关系"

  R005_干扰项可诊断:
    规则: "每个错误选项必须对应一种真实、不同且可解释的错误路径"
    必须打回: "随机凑数、重复同一种错误、凭语感或长度即可排除"
    可以通过: "错误项分别对应边界漏算、口径混淆、公式误用或条件遗漏等具体错误"

  R006_题图信息中立:
    规则: "题图只能可视化题干已经明确给出的对象、结构和条件；不得把目标推导、解题步骤、答案特征画进图中"
    必须打回: "图中出现题干未给的2a、b/2、受力结论、运动方向、规律提示；用颜色或箭头暗示分组"
    可以通过: "图中只重现题干明示条件；必要标签与题干逐字一致；去掉图片后题目仍考同一知识点"

  R009_结构变式而非换皮换数:
    规则: "针对薄弱点的变式必须保留底层认知动作，同时改变信息结构、未知量、设问角度或错误路径"
    必须打回: "只换人物机构主题词或数字；沿用参考题的叙事顺序、罕见术语组合或整组选项；排除固定设问后仍有非通用连续8个汉字重合"
    可以通过: "考点相同但需要重新建模或重新辨析，素材、数据、关系和选项均可独立成立"

  R011_资料分析表图必须工具渲染:
    规则: "资料分析的表格、柱状图、饼图用 render_ziliao_figure.py 生成PNG"
    必须打回: "用Gemini/Banana/generate-question-image.py画表格；图上数字与材料文字不一致"

  R013_资料分析挂钩知识库:
    规则: "资料分析一批默认=4材料×5题=20题，paper_style=gd，tags[0]必须是07-ziliao.md主标签"
    必须打回: "只出5题或15题；旧粗标签（资料分析-综合分析-综合判断）；无视画像弱项"

  R015_资料分析答案分布:
    规则: "4篇里恰好3篇的答案是ABCD各出现一次+1个重复；剩下1篇打散"
    必须打回: "4篇全是ABCD各一+1；4篇全缺某个字母；机械循环A-B-C-D-A"

  R019_近义选项替换回填验证:
    规则: "逻辑填空、语句填入必须把每个高相似错项逐一回填，指出其唯一硬伤"
    必须打回: "两个选项均能形成自然连贯表达；仅以更贴切语感稍弱排除"

  R020_科学模型边界闭环:
    规则: "科学推理必须显式给出接触、浸没、压力、连接、测量环境和截至时间"
    必须打回: "沉底却不说明底面是否接触；滑变图未画出滑片接线；溶液pH上限笼统写成14"

  R021_整批结构不得机械重复:
    规则: "质量审查必须检查整批的论证骨架、错误路径、答案位置、题型配比和难度分布"
    必须打回: "多题重复相关性观察+另有他因+三项无关；10题中8题同一答案；全部题机械标同一难度"

  R029_翻译推理禁止已知回声:
    规则: "正确项不得复述或同义改写题干已知现已知给出的实例事实，必须至少经过一次逆否或选言"
    必须打回: "已知申请认证且免于现场查验，正确项写未接受现场查验；零步推理"
    可以通过: "已知未设立实验室+规则立项→设立实验室，正确项未立项（一次逆否）"

  R030_判断20结构固定:
    规则: "判断推理20题=图形5+逻辑15（论证类为主，翻译最多2题，不出定义/类比/科学）"
    必须打回: "判断20含科学推理；20题全是翻译或全是加强"

  R032_加强削弱项对准论证链:
    规则: "强化削弱型题目的正确项必须作用于本题论证的结论或前提链"
    必须打回: "加强项与结论无因果、只重复背景、或两项皆能加强"

  R033_科学推理广东初中档:
    规则: "广东科学推理是初中难度，杠杆、浮力、串并联、海陆风、等高线、食物链、光合呼吸"
    必须打回: "理想气体/状态方程/动量守恒/动量定理/复杂滑变/平抛圆周/洛伦兹力"
    禁止词_GATE: "理想气体、状态方程、动量守恒、动量定理"

  R034_整卷答案字母均衡:
    规则: "单卷任一字母不宜超过约40%（15题≤6、20题≤8、25题≤10）"
    必须打回: "非资料卷某字母超过40%"
    资料例外: "4篇中3篇ABCD各一+1、1篇打散"

  R035_难度档位主观核对:
    规则: "日练按plan_date隔天轮换difficulty_tier（easy/hard），只改弯子多少"
    easy: "1-2步、设问直接、常见错法干扰、少跨段少约束"
    hard: "同知识点多绕一层、表示转换、多约束、半对干扰、更多跨段综合"

  R010_动态事实权威来源:
    规则: "政治、时政、法律、科技成就、统计数字必须锚定截至日期及权威来源"
    必须打回: "网友回忆版当权威；旧法冒充现行法；虚构讲话政策数字；只查正确项不核验其他三项"

  R028_无画像时均衡诊断:
    规则: "模块画像没有足够样本时，明确回退到均衡诊断，不得臆造弱项"
    必须打回: "画像为空却集中生成单一题型；缺失语句排序、语句填入、细节等基础诊断维度"

自查清单:
  - "题干与选项的对象、单位、方向、时间口径一致？(R001)"
  - "目标知识是否被题干同义改写送回？(R002)"
  - "四个选项是否只有唯一答案？(R003)"
  - "三个错项是否来自三种不同错误？(R005)"
  - "是否复用了参考题的实体/数字链/人物关系？(R009)"
  - "排除固定设问后，是否有连续8字重合？(R009)"
  - "题图是否只画题干明示条件，没有泄露答案？(R006)"
  - "翻译推理是否避免了零步回声？(R029)"
  - "加强/削弱项是否对准论证链？(R032)"
  - "科学推理是否避免了高中大学内容？(R033)"
  - "答案字母是否按answer_plan均衡分布？(R034)"
