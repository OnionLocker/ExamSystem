# 广东 2024-2026 通用卷各模块硬规则（命题 + 校验）
# 出题前必读。凡标【GATE】者已写入 generation_gate.py，命中即拦下本次生成

资料分析:
  结构:
    - 4 篇 × 5 题 = 20
    - 四篇形态互不相同: 纯文字 / 文字+表 / 文字+图(柱/折/饼) / 混合

  考点配置:
    - Q1-Q4: 从考点词表(solver-canon/07-ziliao.md)随机抽，不要求整卷覆盖下限
    - Q5: 综合判断，形式跨篇轮换（属实/无法推出/正确的有几个/能够推出）
    - tags[0] 打在承重卡（比重差/比较/贡献率）
    - 禁止: 资料分析-综合分析-综合判断

  GATE规则:
    - 四篇不得复制同一套五连招(Q1-Q4 考点骨架需跨篇错开) 【GATE】
    - Q5形式四篇不得全部相同 【GATE】
    - 数字脏度: 除年份外，带小数或末两位非00的统计量占比 ≥40% 【GATE】
    - 禁「某省」占位(用G省/H省或全国口径) 【GATE】
    - 禁课纲词(本题考察/秒杀) 【GATE】
    - 答案分布: 4篇中恰好3篇ABCD各一+1、1篇打散 【GATE】

  质量要求:
    - 材料自洽: 分项加总=合计、现期/(1+r)=基期
    - 解析中间量必须与取整后的实际答案一致

数量关系:
  结构:
    - 15 = 数字推理 5 + 数学运算 10
    - 不得 0 数字推理 【GATE】

  数字推理:
    - 题干即数列本体(非应用题)
    - 5题五种规律不克隆: 整数递推 / 小数二级差 / 分组多重 / 数位重排 / 至多1道图形数列
    - 选项贴近能搞死常见解法

  数学运算:
    - 从池随机抽: 日期周期/排列组合概率/最值/几何/行程/利润/工程/方程/容斥
    - 允许某类0或2，不必覆盖每类
    - 禁止默认小学骨架: 鸡兔同笼、长方形周长求面积、纯相向相遇、连续同构分东西
    - 行程用: 往返/变速/流水
    - 几何用: 组合图形/阴影
    - 方程用: 比例和差倍比场景
    - 容斥用: 报名/问卷/三集合
    - 题干短(约50-90字)、要列一个式子、选项不能一眼口算

判断推理:
  结构:
    - 20 = 图形 5 + 逻辑 15
    - 不出类比推理 【GATE】
    - 不出定义判断 【GATE】
    - 不出科学推理 【GATE】

  日练拆分:
    - 两套独立AI batch: 判断推理20 + 科学推理5
    - 不得把科学压进判断卷后5题

  图形推理:
    - 5题五种规律不克隆: 位置/旋转、样式/遍历、属性(曲直/开闭/对称)、数量、空间/三视图
    - 真出图、选项4图

  逻辑判断:
    - 从池随机抽: 加强/削弱/原因解释/翻译推理/分析推理/结构相似
    - 翻译推理每年1-2道
    - 单选题必须恰好一个正确项(分析推理要能排出唯一世界)
    - 加强项要对准结论，跑题项视为缺陷
    - GATE兜底: 答案唯一字母、四个互不相同选项

科学推理:
  结构:
    - 独立日练模块 5题
    - category=科学推理, sub_category=科学推理 【GATE】
    - 禁止写成 category=判断推理 【GATE】
    - 5个学科去重，须含生物与地理各1、物理(力学/压强浮力/电学)≥2
    - 每题必带线框图 【GATE】

  答案字母:
    - 5题任一字母 ≤2、至少3种不同字母 【GATE】
    - 禁止5题同一字母

  难度对齐:
    - 对齐广东初中档，不要高中/大学
    - 物理用: 杠杆平衡、浮力浸没(阿基米德)、串并联简单电路、斜面/滑轮基础
    - 地理用: 海陆风、等高线(山谷山脊/坡向)、昼夜/锋面基础，少写地球自转
    - 生物用: 食物链/食物网、光合作用与呼吸读图、人体调节基础
    - 能算则算，公式限: F=ma, G=mg, p=ρgh, I=U/R, 杠杆F₁L₁=F₂L₂, 并联1/R=1/R₁+1/R₂

  禁止内容_GATE:
    - 理想气体状态方程
    - 动量守恒/动量定理
    - 复杂动态滑动变阻器分析
    - 平抛/圆周综合
    - 洛伦兹力
    - 大学物理口吻

言语理解与表达:
  结构:
    - 15题
    - 逻辑填空约4-6(一空/两空实词或成语近义辨析)
    - 其余片段阅读(主旨/标题/详细理解/推断下句/词句理解)
    - 文段100-250字、能读出主旨

  GATE规则:
    - 禁课纲词 【GATE】
    - 禁「因此亟须…」等作文腔结尾 【GATE】
    - 禁五连同构「某市推广某制度，因此应当坚持…」

  质量要求:
    - 选项像笔试，不是三个极端假+一个明显真
    - 每题唯一答案
    - 解析写清语境/主旨对应

通用规则:
  难度两档:
    - 日练按plan_date隔天轮换: 公历偶数序数日=简单easy，奇数=难hard
    - 难度只改「弯子多少」，广东卷结构/知识点/模块配比一律不变
    - 不得因难度改成国考篇幅，不得出类比/定义
    - easy: 每题1-2步、设问直接、干扰项是常见错法
    - hard: 同一知识点多绕一层、多约束、半对/近义干扰

  答案字母均衡:
    - 整卷正确项按answer_plan均匀放置
    - 单卷任一字母不宜超过约40% 【GATE】
    - 15题≤6、20题≤8、25题≤10
    - 资料分析例外: 4篇中3篇ABCD各一+1、1篇打散
    - 科学推理例外: 任一字母≤2、至少3种不同字母
    - 先算定正确值、再按answer_plan排到指定字母

  禁止项:
    - 不要把任何样卷题目写死进生成器
    - 题面禁课纲词(本题考察/秒杀模型) 【GATE】
