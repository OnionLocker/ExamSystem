# 公考出题命题原则（从 reference-style-principles.md 提炼）
# 内化版本: GONGKAO-STYLE-v1
# 用于生成阶段，让模型理解"什么是真题风格"而非"看着真题改数字"

全题型共同约束:
  真实性原则:
    - 先设计最小认知动作链，再写场景、数字和选项
    - 题干不讲课，不写"本题考察""提示""注意使用某公式"
    - 难度来自隐含关系、表示转换、步骤数、约束耦合或干扰辨析
    - 不来自生僻词、巨大数字、冗长背景、缺条件或歧义
    - 歧义、欠定、事实存疑、图片缺失和多解都是质量缺陷

  选项与干扰项原则:
    - A-D在词性、句法、主体、抽象层级、单位和长度上尽量平行
    - 正确项不得靠外观显眼
    - 每个错误项原则上只错一个主要维度，其余部分保持真实合理
    - 干扰项必须来自可命名的错误路径，禁止答案附近随机凑数
    - 不能让三个错误项统一出现极端词，只靠"所有、必然、唯一"暴露答案

  变式与防抄原则:
    - 变式必须改变信息结构、未知量、量词、状态关系、设问角度或错误路径
    - 不能只换数字、人名、机构名和主题词
    - 可复用公考固定设问
    - 不得复用参考题特有实体、数字链、人物关系、图形布局、例证顺序、罕见术语组合或整组选项
    - 排除固定设问和必要术语后，若出现非通用连续8个汉字重合，按疑似改写抄题打回

  考点与已知信息分离:
    - 写题前列出: TARGET_SKILL（目标技能）、FACTS（已知信息）、MUST_DERIVE（必须推导）、DISTRACTOR_PATHS（干扰项路径）
    - 目标知识不得以括号、备注、同义改写或步骤提示重新送回题干

判断推理:
  逻辑判断:
    - 题干通常约100-165字，选项约20-40字
    - 先明确材料、结论和设问算子
    - 干扰项落在: 替代原因、无关背景、力度不足、必要充分倒置、量词变化、对象错配或条件遗漏
    - 翻译推理: 正确项必须至少经过一次逆否或选言否定肯定，不得复述已知实例（零步回声）
    - 排列约束题规则必须现实、自洽、足够且答案唯一

  图形推理:
    - 图像是题干本体，不得用含糊文字替代
    - 每个错误图只偏离一个关键维度
    - 反查是否存在第二套合理规律

资料分析:
  材料原则:
    - 一篇材料绑一组题，材料必须自洽，题能从材料算完
    - 广东文字350-700字、3-5段
    - 数字是命题编的模拟数，自洽即可，用来练知识点
    - 广东默认质量靶心为4段、420-650字
    - 正文不放模拟数据声明或政策口号
    - 每篇至少3段进入设问，全卷至少2道跨段综合判断

  题目设置:
    - 每篇5题的tags[0]用知识库主标签(07-ziliao.md)
    - 不要写旧粗标签或"资料分析-综合分析-综合判断"
    - 末题可出综合判断句，标签打在正确项最重的那张卡上
    - 干扰项来自: 基期现期倒置、百分点混淆、增长率当增长量、单位遗漏、取错行列
    - 每题三个错误项必须有不同、可复算且来自材料的错因

  表图原则:
    - 表格/图表必须用 render_ziliao_figure.py 生成PNG
    - 禁止Gemini/Banana生表或手绘坐标轴
    - 材料与选项每个数字都抄进代码验算
    - 不同量纲共图时，单位必须分别绑定到系列名或独立坐标轴，禁止斜杠合并单位

数量关系:
  数字推理:
    - 先判断信息单元: 相邻差、二级构造、分组、递推、项内数位、反约分或幂次复合
    - 规则应跨至少4次转移稳定成立，并能脱离选项唯一生成
    - 变式要改变分组、状态阶数、修正来源、空缺位置或设问角度
    - 不能只换首项和公差
    - 干扰项分别对应: 少进一层、项次错位、漏修正、符号反向、未反约分等真实错误

  数学运算:
    - 常规题干约50-110字
    - 每个单位、条件和实体都必须进入模型或承担辨析功能
    - 几何、运动和日期题明确: 计量对象、不变量、方向、端点事件、闭区间及闰年边界
    - 难度按模型显隐、表示转换、步骤数、假设搜索和约束耦合划分
    - 每个选项都从一种真实错误模型算出

言语理解与表达:
  逻辑填空:
    - 材料应是2-4句的完整说明或议论语段，以2-3空为主体
    - 常规材料约106-145字
    - 每个空都必须贡献约束，并通过搭配、词义、语体、色彩和逻辑照应形成跨空联动
    - 干扰项采用"一空成立、其余失配"的半对组合或近义词细差
    - 不靠生僻词制造难度

  片段阅读:
    - 材料必须是单一、自足、可核验的3-6句段落，常规约185-240字
    - 主旨题允许高一层概括但不得换主体
    - 细节题只使用明示信息或一步推论
    - 意图题只有在文段确有问题导向时才上推直接对策
    - 选项保持同一主语、句法和抽象层级
    - 典型错误为: 局部冒充全文、范围变化、主体或因果偷换、引入文外常识

科学推理:
  难度对齐:
    - 广东样本偏短场景、高有效信息，常见约60-145字
    - 优先日常现象和基础科学关系
    - 对齐广东初中档: 杠杆平衡、浮力浸没、串并联简单电路、海陆风、等高线、食物链、光合呼吸
    - 能算用: F=ma, G=mg, p=ρgh, I=U/R, 杠杆F₁L₁=F₂L₂, 并联1/R=1/R₁+1/R₂

  模型边界:
    - 趋势、斜率、面积、受力方向、系统边界、单位和数量级必须唯一明确
    - 必须显式给出: 接触、浸没、压力、连接、测量环境和截至时间
    - 干扰项来自: 趋势反转、对象错位、边界遗漏、物理量混淆、原理误用或数量级错误

图片规则:
  使用原则:
    - 只有图像参与唯一判定时才配图
    - 图形、空间、电路、曲线、实验装置和化学结构通常必须带图
    - 图片只能呈现已知状态、必要标签、坐标轴和中性编号
    - 不得呈现规律、推导或答案

  视觉规范:
    - 默认白底黑线、紧凑留白、统一线宽和清晰度
    - 选项之间不得出现非故意的画质差异
    - 数据标签不得与柱形、折线、网格线、刻度或其他文字重合
    - 必须按移动端最终尺寸(320px宽)复核，确保文字、单位和刻度不小于12px

入库前最终检查:
  - 目标考点单一，训练动作可复用
  - 题干事实闭环，无偷补条件、时点错误或无效背景
  - 正确项唯一，A-D均被独立验证
  - 每个干扰项有不同且真实的错误路径
  - 长度和信息密度落在同题型参考区间
  - 选项句法、层级、单位与长度平行
  - 与生成参考题没有换皮、连续措辞或结构性抄袭
  - 图片题图文一致、信息中立、路径可用且移动端清楚
